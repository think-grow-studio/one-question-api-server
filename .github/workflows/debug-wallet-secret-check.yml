name: Debug Wallet Secret Check (temporary)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect secret shape (no value leaked)
        env:
          WALLET_B64: ${{ secrets.ORACLE_MAIN_WALLET_COMPRESSED_BASE64 }}
        run: |
          echo "char length: ${#WALLET_B64}"
          echo "line count:"
          printf '%s' "$WALLET_B64" | grep -c '' || true
          echo "is empty: $([ -z "$WALLET_B64" ] && echo yes || echo no)"
