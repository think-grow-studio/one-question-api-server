name: Docker Build and Push to GHCR

on:
  workflow_run:
    workflows: ["Spring Build With Gradle"]
    types:
      - completed

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_branch == 'main' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar-${{ github.event.workflow_run.head_sha }}
          path: app
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate lowercase repository name
        id: repo
        run: echo "repository=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # workflow_run 이벤트에서는 GITHUB_SHA 가 "기본 브랜치의 마지막 커밋"이라
      # metadata-action 의 type=sha 를 쓰면 실제로 빌드한 커밋이 아닌 값이 태그로 붙는다.
      # 트리거한 워크플로의 head_sha 에서 직접 계산한다.
      - name: Resolve image tag from the built commit
        id: tag
        run: echo "sha_short=$(echo ${{ github.event.workflow_run.head_sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ steps.repo.outputs.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=sha-${{ steps.tag.outputs.sha_short }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # latest 가 아니라 불변 태그를 내려보낸다. 배포 워크플로가 이 값으로 두 VM 을 고정해야
      # main/sub 가 서로 다른 빌드를 pull 하는 일이 없고, 롤백도 태그 교체로 끝난다.
      - name: Save image URL for downstream workflows
        run: echo "ghcr.io/${{ steps.repo.outputs.repository }}:sha-${{ steps.tag.outputs.sha_short }}" > image-url.txt

      - name: Upload image URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-url
          path: image-url.txt
          retention-days: 1

      - name: Send Discord Docker Job Status
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          color: ${{ job.status == 'success' && '0x00ff00' || '0xff0000' }}
          title: "[${{ github.repository }}] ${{ job.status == 'success' && '✅ Docker Image Pushed' || '❌ Docker Build/Push Failed' }}"
          description: |
            Docker build & push job status for **${{ github.repository }}**.

            **Image:** `ghcr.io/${{ steps.repo.outputs.repository }}:sha-${{ steps.tag.outputs.sha_short }}`
            **Commit:** [`${{ steps.tag.outputs.sha_short }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }})

            ${{ job.status == 'success' && format('**Tags Applied:**\n```{0}```', steps.meta.outputs.tags) || '**Failure detected!** Please check the workflow logs.' }}
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: "도커 도우미"