name: Dev Deploy to Oracle Cloud VM

on:
  workflow_run:
    workflows: ["Dev Docker Build and Push to GHCR"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      status: ${{ steps.deployment.outcome }}
      image_url: ${{ steps.setup.outputs.image_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Download image URL artifact
        uses: actions/download-artifact@v4
        with:
          name: dev-image-url
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Variables
        id: setup
        run: |
          IMAGE_URL=$(cat image-url.txt)
          echo "image_url=$IMAGE_URL" >> $GITHUB_OUTPUT
          echo "Using image: $IMAGE_URL"

      - name: Upload docker-compose.yml and nginx conf to DEV VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_VM_HOST }}
          username: ${{ secrets.DEV_VM_USERNAME }}
          key: ${{ secrets.DEV_VM_SSH_KEY }}
          port: 22
          source: "docker-compose.dev.yml,nginx/dev.conf"
          target: "/home/ubuntu"
          strip_components: 0
          overwrite: true

      - name: Deploy and Health Check DEV VM
        id: deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_VM_HOST }}
          username: ${{ secrets.DEV_VM_USERNAME }}
          key: ${{ secrets.DEV_VM_SSH_KEY }}
          port: 22
          script: |
            set -e

            # 변수 설정
            CONTAINER_NAME="one-question-api"
            COMPOSE_FILE="/home/ubuntu/docker-compose.dev.yml"

            echo "🚀 [DEV VM] Starting deployment (app + nginx via docker compose)"

            # GitHub Container Registry 로그인
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # 배포 함수
            deploy_container() {
              echo "🧹 [DEV VM] Removing legacy standalone container (pre-compose 배포 잔재)..."
              docker stop $CONTAINER_NAME 2>/dev/null || true
              docker rm $CONTAINER_NAME 2>/dev/null || true

              export ORACLE_DB_DRIVER="${{ secrets.ORACLE_DB_DRIVER }}"
              export ORACLE_DB_URL="${{ secrets.DEV_ORACLE_DB_URL }}"
              export ORACLE_DB_USERNAME="${{ secrets.DEV_ORACLE_DB_USERNAME }}"
              export ORACLE_DB_PASSWORD="${{ secrets.DEV_ORACLE_DB_PASSWORD }}"
              export ORACLE_DB_DIALECT="${{ secrets.ORACLE_DB_DIALECT }}"
              export ORACLE_WALLET_BASE64="${{ secrets.ORACLE_DEV_WALLET_COMPRESSED_BASE64 }}"
              export JWT_SECRET_KEY="${{ secrets.DEV_JWT_SECRET_KEY }}"
              export JWT_ACCESS_EXPIRE_TIME="${{ secrets.JWT_ACCESS_EXPIRE_TIME }}"
              export JWT_REFRESH_EXPIRE_TIME="${{ secrets.JWT_REFRESH_EXPIRE_TIME }}"
              export APP_VERSION_MIN="${{ secrets.APP_VERSION_MIN }}"
              export APP_VERSION_LATEST="${{ secrets.APP_VERSION_LATEST }}"
              export APP_SERVER_LIVE="${{ secrets.APP_SERVER_LIVE }}"
              export GOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}"
              export DISCORD_LOGGING_WEBHOOK_URL="${{ secrets.DISCORD_LOGGING_WEBHOOK_URL }}"
              export ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL }}"
              export FIREBASE_SERVICE_ACCOUNT_JSON="${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}"
              export APPLE_CLIENT_ID="${{ secrets.APPLE_CLIENT_ID }}"
              export APPLE_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
              export APPLE_KEY_ID="${{ secrets.APPLE_KEY_ID }}"
              export APPLE_PRIVATE_KEY="${{ secrets.APPLE_PRIVATE_KEY }}"
              export AWS_REGION="${{ secrets.AWS_REGION }}"
              export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
              export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
              export ANALYSIS_REPORT_QUEUE_URL="${{ secrets.ANALYSIS_REPORT_QUEUE_URL }}"

              echo "📦 [DEV VM] Pulling images..."
              docker compose -f $COMPOSE_FILE pull

              echo "📦 [DEV VM] Starting app + nginx..."
              docker compose -f $COMPOSE_FILE up -d

              echo "⏳ [DEV VM] Waiting for containers to start..."
              sleep 30
            }

            # nginx 설정 리로드 함수 (nginx.conf는 SCP로 덮어쓰기만 되고
            # 컨테이너 자체는 up -d로 재생성되지 않을 수 있어, 최신 설정을 반영하려면 명시적 reload 필요)
            reload_nginx() {
              echo "🔄 [DEV VM] Reloading nginx to apply latest config..."
              if docker exec one-question-nginx nginx -t; then
                docker exec one-question-nginx nginx -s reload
                echo "✅ [DEV VM] nginx reloaded"
              else
                echo "❌ [DEV VM] nginx config test failed, skipping reload"
                return 1
              fi
            }

            # 헬스체크 함수
            health_check() {
              echo "🔍 [DEV VM] Starting health check..."
              local max_attempts=6
              local wait_time=20

              for attempt in $(seq 1 $max_attempts); do
                echo "⏳ [DEV VM] Health check attempt $attempt/$max_attempts..."

                # 컨테이너 상태 확인
                if ! docker ps --filter "name=$CONTAINER_NAME" --format "{{.Names}}" | grep -q "^${CONTAINER_NAME}$"; then
                  echo "❌ [DEV VM] Container '$CONTAINER_NAME' is not running"
                  echo "📋 [DEV VM] Container logs:"
                  docker logs --tail=20 $CONTAINER_NAME 2>/dev/null || echo "No logs available"
                  return 1
                fi

                # HTTP 헬스체크
                local response
                local http_code
                local body

                if response=$(curl -s -w "%{http_code}" --connect-timeout 20 --max-time 20 -k "https://localhost:443/api/v1/health" 2>/dev/null); then
                  http_code="${response: -3}"
                  body="${response%???}"

                  echo "📡 [DEV VM] HTTP Response: $http_code"
                  echo "📄 [DEV VM] Body: $body"

                  if [[ "$http_code" == "200" ]] && echo "$body" | grep -q "healthy"; then
                    echo "✅ [DEV VM] Health check passed!"
                    return 0
                  fi
                else
                  echo "🔌 [DEV VM] Health check request failed"
                fi

                if [[ $attempt -lt $max_attempts ]]; then
                  echo "⏱️ [DEV VM] Waiting ${wait_time}s before retry..."
                  sleep $wait_time
                fi
              done

              echo "❌ [DEV VM] Health check failed after $max_attempts attempts"
              echo "📋 [DEV VM] Final container logs:"
              docker logs --tail=30 $CONTAINER_NAME 2>/dev/null || echo "No logs available"
              return 1
            }

            # 실행
            deploy_container
            reload_nginx
            health_check
            echo "🎉 [DEV VM] Deployment completed successfully!"

  # 알림 Job
  # deploy가 진짜로 시도됐을 때만 알림 (dev와 무관한 브랜치 push로 상위 워크플로가
  # skipped 되면 deploy도 스킵되는데, 이걸 "실패"로 오탐하지 않도록 방지)
  notify:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: ${{ always() && github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ needs.deploy.outputs.status }}
          color: ${{ needs.deploy.outputs.status == 'success' && '0x00ff00' || '0xff0000' }}
          title: "[${{ github.repository }}] ${{ needs.deploy.outputs.status == 'success' && '🎉 Dev Deployment Successful' || '🚨 Dev Deployment Failed' }}"
          description: |
            **Dev Deployment Results:**

            ${{ needs.deploy.outputs.status == 'success' && '🟢 ✅' || '🔴 ❌' }} **DEV VM**: ${{ needs.deploy.outputs.status == 'success' && 'SUCCESS' || 'FAILED' }}

            **Image**: `${{ needs.deploy.outputs.image_url }}`

            ${{ needs.deploy.outputs.status != 'success' && '⚠️ Please check the workflow logs.' || '' }}
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: "Dev 배포 도우미"
