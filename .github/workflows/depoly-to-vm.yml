name: Deploy to Oracle Cloud VM

on:
  workflow_run:
    workflows: ["Docker Build and Push to GHCR"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      status: ${{ steps.deployment.outcome }}
      image_url: ${{ steps.setup.outputs.image_url }}
      image_tag: ${{ steps.setup.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Download image URL artifact
        uses: actions/download-artifact@v4
        with:
          name: image-url
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Variables
        id: setup
        run: |
          set -e
          IMAGE_URL=$(cat image-url.txt)
          IMAGE_TAG=${IMAGE_URL##*:}
          # latest 로 배포되면 롤백도 버전 확인도 불가능해지므로 커밋 태그가 아니면 중단한다
          case "$IMAGE_TAG" in
            sha-*) ;;
            *) echo "::error::불변 태그가 아닙니다 (image-url.txt = $IMAGE_URL). 배포를 중단합니다."; exit 1 ;;
          esac
          echo "image_url=$IMAGE_URL" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Using image: $IMAGE_URL"

      - name: Render nginx conf with sub VM upstream
        run: |
          sed -i "s|__SUB_VM_PRIVATE_IP__|${{ secrets.SUB_VM_PRIVATE_IP }}|g" nginx/prod.conf

      - name: Upload docker-compose.yml and nginx conf to MAIN VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MAIN_VM_HOST }}
          username: ${{ secrets.MAIN_VM_USERNAME }}
          key: ${{ secrets.MAIN_VM_SSH_KEY }}
          port: 22
          source: "docker-compose.prod.yml,nginx/prod.conf"
          target: "/home/ubuntu"
          strip_components: 0
          overwrite: true

      - name: Deploy and Health Check MAIN VM
        id: deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.MAIN_VM_HOST }}
          username: ${{ secrets.MAIN_VM_USERNAME }}
          key: ${{ secrets.MAIN_VM_SSH_KEY }}
          port: 22
          script: |
            set -e

            # 변수 설정
            CONTAINER_NAME="one-question-api"
            COMPOSE_FILE="/home/ubuntu/docker-compose.prod.yml"

            echo "🚀 [MAIN VM] Starting deployment (app + nginx via docker compose)"

            # GitHub Container Registry 로그인
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # 배포 함수
            deploy_container() {
              echo "🧹 [MAIN VM] Removing legacy standalone container (pre-compose 배포 잔재)..."
              docker stop $CONTAINER_NAME 2>/dev/null || true
              docker rm $CONTAINER_NAME 2>/dev/null || true

              export ORACLE_DB_DRIVER="${{ secrets.ORACLE_DB_DRIVER }}"
              export ORACLE_DB_URL="${{ secrets.ORACLE_DB_URL }}"
              export ORACLE_DB_USERNAME="${{ secrets.ORACLE_DB_USERNAME }}"
              export ORACLE_DB_PASSWORD="${{ secrets.ORACLE_DB_PASSWORD }}"
              export ORACLE_DB_DIALECT="${{ secrets.ORACLE_DB_DIALECT }}"
              export ORACLE_WALLET_BASE64="${{ secrets.ORACLE_MAIN_WALLET_COMPRESSED_BASE64 }}"
              export JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}"
              export JWT_ACCESS_EXPIRE_TIME="${{ secrets.JWT_ACCESS_EXPIRE_TIME }}"
              export JWT_REFRESH_EXPIRE_TIME="${{ secrets.JWT_REFRESH_EXPIRE_TIME }}"
              export APP_VERSION_MIN="${{ secrets.APP_VERSION_MIN }}"
              export APP_VERSION_LATEST="${{ secrets.APP_VERSION_LATEST }}"
              export APP_SERVER_LIVE="${{ secrets.APP_SERVER_LIVE }}"
              export GOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}"
              export DISCORD_LOGGING_WEBHOOK_URL="${{ secrets.DISCORD_LOGGING_WEBHOOK_URL }}"
              export ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL }}"
              export FIREBASE_SERVICE_ACCOUNT_JSON="${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}"
              export APPLE_CLIENT_ID="${{ secrets.APPLE_CLIENT_ID }}"
              export APPLE_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
              export APPLE_KEY_ID="${{ secrets.APPLE_KEY_ID }}"
              export APPLE_PRIVATE_KEY="${{ secrets.APPLE_PRIVATE_KEY }}"
              export AWS_REGION="${{ secrets.AWS_REGION }}"
              export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
              export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
              export ANALYSIS_REPORT_QUEUE_URL="${{ secrets.ANALYSIS_REPORT_QUEUE_URL }}"

              # 커밋 단위 불변 태그로 고정한다. compose 는 프로젝트 디렉토리의 .env 를 자동으로
              # 읽으므로, VM 에서 수동으로 up 해도 배포된 버전 그대로 뜨고 지금 뭐가 떠 있는지도 남는다.
              export IMAGE_TAG="${{ steps.setup.outputs.image_tag }}"
              ENV_FILE=/home/ubuntu/.env
              touch "$ENV_FILE"
              grep -v '^IMAGE_TAG=' "$ENV_FILE" > "$ENV_FILE.tmp" || true
              echo "IMAGE_TAG=$IMAGE_TAG" >> "$ENV_FILE.tmp"
              mv "$ENV_FILE.tmp" "$ENV_FILE"
              echo "🏷️ [MAIN VM] Deploying tag: $IMAGE_TAG"

              echo "📦 [MAIN VM] Pulling images..."
              docker compose -f $COMPOSE_FILE pull

              echo "📦 [MAIN VM] Starting app + nginx..."
              docker compose -f $COMPOSE_FILE up -d

              echo "⏳ [MAIN VM] Waiting for containers to start..."
              sleep 30
            }

            # nginx 설정 리로드 함수 (nginx.conf는 SCP로 덮어쓰기만 되고
            # 컨테이너 자체는 up -d로 재생성되지 않을 수 있어, 최신 설정을 반영하려면 명시적 reload 필요)
            reload_nginx() {
              echo "🔄 [MAIN VM] Reloading nginx to apply latest config..."
              if docker exec one-question-nginx nginx -t; then
                docker exec one-question-nginx nginx -s reload
                echo "✅ [MAIN VM] nginx reloaded"
              else
                echo "❌ [MAIN VM] nginx config test failed, skipping reload"
                return 1
              fi
            }

            # 헬스체크 함수
            health_check() {
              echo "🔍 [MAIN VM] Starting health check..."
              local max_attempts=6
              local wait_time=20

              for attempt in $(seq 1 $max_attempts); do
                echo "⏳ [MAIN VM] Health check attempt $attempt/$max_attempts..."

                # 컨테이너 상태 확인
                if ! docker ps --filter "name=$CONTAINER_NAME" --format "{{.Names}}" | grep -q "^${CONTAINER_NAME}$"; then
                  echo "❌ [MAIN VM] Container '$CONTAINER_NAME' is not running"
                  echo "📋 [MAIN VM] Container logs:"
                  docker logs --tail=20 $CONTAINER_NAME 2>/dev/null || echo "No logs available"
                  return 1
                fi

                # HTTP 헬스체크
                local response
                local http_code
                local body

                if response=$(curl -s -w "%{http_code}" --connect-timeout 20 --max-time 20 -k "https://localhost:443/api/v1/health" 2>/dev/null); then
                  http_code="${response: -3}"
                  body="${response%???}"

                  echo "📡 [MAIN VM] HTTP Response: $http_code"
                  echo "📄 [MAIN VM] Body: $body"

                  if [[ "$http_code" == "200" ]] && echo "$body" | grep -q "healthy"; then
                    echo "✅ [MAIN VM] Health check passed!"
                    return 0
                  fi
                else
                  echo "🔌 [MAIN VM] Health check request failed"
                fi

                if [[ $attempt -lt $max_attempts ]]; then
                  echo "⏱️ [MAIN VM] Waiting ${wait_time}s before retry..."
                  sleep $wait_time
                fi
              done

              echo "❌ [MAIN VM] Health check failed after $max_attempts attempts"
              echo "📋 [MAIN VM] Final container logs:"
              docker logs --tail=30 $CONTAINER_NAME 2>/dev/null || echo "No logs available"
              return 1
            }

            # 실행
            deploy_container
            reload_nginx
            health_check
            echo "🎉 [MAIN VM] Deployment completed successfully!"

  # main이 healthy를 확인한 뒤에만 sub를 배포한다 (동시에 둘 다 내려가는 상황 방지).
  # main 재배포로 죽어있는 동안은 nginx 패시브 헬스체크가 sub로 트래픽을 자동으로 몰아주고,
  # 이 job이 도는 동안(sub 재배포)에는 반대로 main이 이미 살아있으니 nginx가 자동으로 main에만 몰아준다.
  deploy-sub:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: ${{ needs.deploy.outputs.status == 'success' }}
    outputs:
      status: ${{ steps.deployment.outcome }}

    steps:
      - uses: actions/checkout@v4

      - name: Upload docker-compose.yml to SUB VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SUB_VM_HOST }}
          username: ${{ secrets.SUB_VM_USERNAME }}
          key: ${{ secrets.SUB_VM_SSH_KEY }}
          port: 22
          source: "docker-compose.sub.yml"
          target: "/home/ubuntu"
          strip_components: 0
          overwrite: true

      - name: Deploy and Health Check SUB VM
        id: deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SUB_VM_HOST }}
          username: ${{ secrets.SUB_VM_USERNAME }}
          key: ${{ secrets.SUB_VM_SSH_KEY }}
          port: 22
          script: |
            set -e

            CONTAINER_NAME="one-question-api"
            COMPOSE_FILE="/home/ubuntu/docker-compose.sub.yml"

            echo "🚀 [SUB VM] Starting deployment (app only, nginx 없음)"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            deploy_container() {
              echo "🧹 [SUB VM] Cleaning up..."
              docker stop $CONTAINER_NAME 2>/dev/null || true
              docker rm $CONTAINER_NAME 2>/dev/null || true

              export ORACLE_DB_DRIVER="${{ secrets.ORACLE_DB_DRIVER }}"
              export ORACLE_DB_URL="${{ secrets.ORACLE_DB_URL }}"
              export ORACLE_DB_USERNAME="${{ secrets.ORACLE_DB_USERNAME }}"
              export ORACLE_DB_PASSWORD="${{ secrets.ORACLE_DB_PASSWORD }}"
              export ORACLE_DB_DIALECT="${{ secrets.ORACLE_DB_DIALECT }}"
              # wallet 은 이미지에 굽지 않고 런타임에 주입한다 (컨테이너 entrypoint 가 풀어서 사용)
              export ORACLE_WALLET_BASE64="${{ secrets.ORACLE_MAIN_WALLET_COMPRESSED_BASE64 }}"
              export JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}"
              export JWT_ACCESS_EXPIRE_TIME="${{ secrets.JWT_ACCESS_EXPIRE_TIME }}"
              export JWT_REFRESH_EXPIRE_TIME="${{ secrets.JWT_REFRESH_EXPIRE_TIME }}"
              export APP_VERSION_MIN="${{ secrets.APP_VERSION_MIN }}"
              export APP_VERSION_LATEST="${{ secrets.APP_VERSION_LATEST }}"
              export APP_SERVER_LIVE="${{ secrets.APP_SERVER_LIVE }}"
              export GOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}"
              export DISCORD_LOGGING_WEBHOOK_URL="${{ secrets.DISCORD_LOGGING_WEBHOOK_URL }}"
              export ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL }}"
              export FIREBASE_SERVICE_ACCOUNT_JSON="${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}"
              export APPLE_CLIENT_ID="${{ secrets.APPLE_CLIENT_ID }}"
              export APPLE_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
              export APPLE_KEY_ID="${{ secrets.APPLE_KEY_ID }}"
              export APPLE_PRIVATE_KEY="${{ secrets.APPLE_PRIVATE_KEY }}"
              export AWS_REGION="${{ secrets.AWS_REGION }}"
              export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
              export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
              export ANALYSIS_REPORT_QUEUE_URL="${{ secrets.ANALYSIS_REPORT_QUEUE_URL }}"

              # main VM 이 배포한 것과 동일한 태그를 그대로 물려받는다.
              # latest 를 쓰면 main 배포 이후 새 빌드가 올라올 경우 sub 만 다른 버전을 pull 해서
              # nginx 가 두 VM 에 라운드로빈 하는 동안 버전이 섞인 채로 서비스된다.
              export IMAGE_TAG="${{ needs.deploy.outputs.image_tag }}"
              ENV_FILE=/home/ubuntu/.env
              touch "$ENV_FILE"
              grep -v '^IMAGE_TAG=' "$ENV_FILE" > "$ENV_FILE.tmp" || true
              echo "IMAGE_TAG=$IMAGE_TAG" >> "$ENV_FILE.tmp"
              mv "$ENV_FILE.tmp" "$ENV_FILE"
              echo "🏷️ [SUB VM] Deploying tag: $IMAGE_TAG"

              echo "📦 [SUB VM] Pulling image..."
              docker compose -f $COMPOSE_FILE pull

              echo "📦 [SUB VM] Starting app..."
              docker compose -f $COMPOSE_FILE up -d

              echo "⏳ [SUB VM] Waiting for container to start..."
              sleep 30
            }

            # 헬스체크 함수 (nginx가 없으므로 app 8080에 직접, HTTP로 확인)
            health_check() {
              echo "🔍 [SUB VM] Starting health check..."
              local max_attempts=6
              local wait_time=20

              for attempt in $(seq 1 $max_attempts); do
                echo "⏳ [SUB VM] Health check attempt $attempt/$max_attempts..."

                if ! docker ps --filter "name=$CONTAINER_NAME" --format "{{.Names}}" | grep -q "^${CONTAINER_NAME}$"; then
                  echo "❌ [SUB VM] Container '$CONTAINER_NAME' is not running"
                  echo "📋 [SUB VM] Container logs:"
                  docker logs --tail=20 $CONTAINER_NAME 2>/dev/null || echo "No logs available"
                  return 1
                fi

                local response
                local http_code
                local body

                if response=$(curl -s -w "%{http_code}" --connect-timeout 20 --max-time 20 "http://localhost:8080/api/v1/health" 2>/dev/null); then
                  http_code="${response: -3}"
                  body="${response%???}"

                  echo "📡 [SUB VM] HTTP Response: $http_code"
                  echo "📄 [SUB VM] Body: $body"

                  if [[ "$http_code" == "200" ]] && echo "$body" | grep -q "healthy"; then
                    echo "✅ [SUB VM] Health check passed!"
                    return 0
                  fi
                else
                  echo "🔌 [SUB VM] Health check request failed"
                fi

                if [[ $attempt -lt $max_attempts ]]; then
                  echo "⏱️ [SUB VM] Waiting ${wait_time}s before retry..."
                  sleep $wait_time
                fi
              done

              echo "❌ [SUB VM] Health check failed after $max_attempts attempts"
              echo "📋 [SUB VM] Final container logs:"
              docker logs --tail=30 $CONTAINER_NAME 2>/dev/null || echo "No logs available"
              return 1
            }

            # 실행
            deploy_container
            health_check
            echo "🎉 [SUB VM] Deployment completed successfully!"

  # 알림 Job
  # deploy가 진짜로 시도됐을 때만 알림 (main과 무관한 브랜치 push로 상위 워크플로가
  # skipped 되면 deploy/deploy-sub도 스킵되는데, 이걸 "실패"로 오탐하지 않도록 방지)
  notify:
    runs-on: ubuntu-latest
    needs: [deploy, deploy-sub]
    if: ${{ always() && github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ (needs.deploy.outputs.status == 'success' && needs.deploy-sub.outputs.status == 'success') && 'success' || 'failure' }}
          color: ${{ (needs.deploy.outputs.status == 'success' && needs.deploy-sub.outputs.status == 'success') && '0x00ff00' || '0xff0000' }}
          title: "[${{ github.repository }}] ${{ (needs.deploy.outputs.status == 'success' && needs.deploy-sub.outputs.status == 'success') && '🎉 Deployment Successful' || '🚨 Deployment Failed' }}"
          description: |
            **Deployment Results:**

            ${{ needs.deploy.outputs.status == 'success' && '🟢 ✅' || '🔴 ❌' }} **MAIN VM**: ${{ needs.deploy.outputs.status == 'success' && 'SUCCESS' || 'FAILED' }}
            ${{ needs.deploy-sub.result == 'skipped' && '⏭️' || (needs.deploy-sub.outputs.status == 'success' && '🟢 ✅' || '🔴 ❌') }} **SUB VM**: ${{ needs.deploy-sub.result == 'skipped' && 'SKIPPED (main 실패로 스킵)' || (needs.deploy-sub.outputs.status == 'success' && 'SUCCESS' || 'FAILED') }}

            **Image**: `${{ needs.deploy.outputs.image_url }}`

            ${{ (needs.deploy.outputs.status != 'success' || (needs.deploy-sub.result != 'skipped' && needs.deploy-sub.outputs.status != 'success')) && '⚠️ Please check the workflow logs.' || '' }}
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: "배포 도우미"
