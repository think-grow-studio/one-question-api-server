services:
  app:
    image: ghcr.io/think-grow-studio/one-question-api-server:latest
    container_name: one-question-api
    restart: unless-stopped
    mem_limit: 1200m
    ports:
      - "8081:8081"
    volumes:
      - /home/ubuntu/log-one:/root/log-one
      - /home/ubuntu/heapdump:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ORACLE_DB_DRIVER: ${ORACLE_DB_DRIVER}
      ORACLE_DB_URL: ${ORACLE_DB_URL}
      ORACLE_DB_USERNAME: ${ORACLE_DB_USERNAME}
      ORACLE_DB_PASSWORD: ${ORACLE_DB_PASSWORD}
      ORACLE_DB_DIALECT: ${ORACLE_DB_DIALECT}
      ORACLE_WALLET_BASE64: ${ORACLE_WALLET_BASE64}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_EXPIRE_TIME: ${JWT_ACCESS_EXPIRE_TIME}
      JWT_REFRESH_EXPIRE_TIME: ${JWT_REFRESH_EXPIRE_TIME}
      APP_VERSION_MIN: ${APP_VERSION_MIN}
      APP_VERSION_LATEST: ${APP_VERSION_LATEST}
      APP_SERVER_LIVE: ${APP_SERVER_LIVE}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID}
      DISCORD_LOGGING_WEBHOOK_URL: ${DISCORD_LOGGING_WEBHOOK_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID}
      APPLE_KEY_ID: ${APPLE_KEY_ID}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      ANALYSIS_REPORT_QUEUE_URL: ${ANALYSIS_REPORT_QUEUE_URL}

  nginx:
    image: nginx:1.27-alpine
    container_name: one-question-nginx
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "443:443"
      - "80:80"
    volumes:
      # 파일 단위 바인드 마운트는 inode가 고정되어 scp로 파일이 교체돼도 컨테이너가 옛날 내용을
      # 계속 보는 문제가 있어, 디렉토리 단위로 마운트 (경로 조회가 매번 새로 일어나 최신 파일을 봄)
      - /home/ubuntu/nginx:/etc/nginx/conf.d:ro
      - /home/ubuntu/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "443"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
