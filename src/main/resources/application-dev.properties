server.port=8080

# Management Server (HTTP, internal monitoring only)
management.server.port=8081
management.server.ssl.enabled=false
management.endpoints.web.exposure.include=prometheus,health
management.endpoint.health.show-details=always

# Datasource (Environment variables)
spring.datasource.url=${ORACLE_DB_URL}
spring.datasource.driver-class-name=${ORACLE_DB_DRIVER}
spring.datasource.username=${ORACLE_DB_USERNAME}
spring.datasource.password=${ORACLE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

# AWS / SQS
app.aws.region=${AWS_REGION:ap-northeast-2}
app.aws.sqs.api-call-timeout-ms=20000
app.aws.sqs.api-call-attempt-timeout-ms=6000

# BackgroundJob Publisher (dev: 발행 활성)
app.background-job.publisher.enabled=true
app.background-job.publisher.fixed-delay-ms=5000
app.background-job.publisher.claim-duration-minutes=10
app.analysis-report.sqs.queue-url=${ANALYSIS_REPORT_QUEUE_URL}

# App Version (Dev Environment)
app.version.min=${APP_VERSION_MIN}
app.version.latest=${APP_VERSION_LATEST}
app.server.live=${APP_SERVER_LIVE}
